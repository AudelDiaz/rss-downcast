[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rss-downcast"
version = "2.0.0"
description = "Download, manage and archive podcast episodes from RSS feeds"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.11"
authors = [{ name = "Audel Diaz" }]
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.27",
    "mutagen>=1.45",
    "typer>=0.12",
]
homepage = "https://github.com/AudelDiaz/rss-downcast"

[project.urls]
Homepage = "https://github.com/AudelDiaz/rss-downcast"
Repository = "https://github.com/AudelDiaz/rss-downcast"
Issues = "https://github.com/AudelDiaz/rss-downcast/issues"

[project.scripts]
rss-downcast = "rss_downcast.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rss_downcast"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-v --tb=short -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET"]
